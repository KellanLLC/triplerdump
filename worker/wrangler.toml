name = "triplerdump"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Static marketing site (built into ../deploy by build_deploy.py).
# Requests matching a file are served as static assets; everything else
# (/book, /api/*, /admin, /r/*, /calendar) runs the Worker below.
[assets]
directory = "../deploy"

[[d1_databases]]
binding = "DB"
database_name = "triplerdump_bookings"
database_id = "c9394039-46ce-4d42-99cc-4fc195d7ded0"

[triggers]
# Hourly, not daily: the review follow-up ladder fires +24h/+24h/+48h from the
# previous message, which a once-a-day tick cannot honour. The handler gates the
# delivery/pickup reminder sweep to 10:00 America/Denver so it still lands at a
# civilised hour; everything else benefits from running more often.
crons = ["0 * * * *"]

[vars]
# Canonical host. www (not the apex) — it is what Wix served before the cutover, so
# search engines and existing links keep working; the apex 301s here via a Cloudflare
# redirect rule. Must stay in step with the CMS "Website address used in links".
SITE_ORIGIN = "https://www.triplerdump.com"
